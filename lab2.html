<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2 — Варіант 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 900px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        td {
            border: 2px solid #333;
            padding: 15px 5px;
            text-align: center;
            vertical-align: middle;
            font-size: 15px;
            font-weight: bold;
            width: 150px; 
        }
        /* --- колір 1 рядка --- */
        .row-1 {
            background-color: #048f8f;
            color: #ffffff; /* Контрастний білий з color.adobe.com */
            transition: background-color 0.3s, color 0.3s;
        }
        /* Hover для 1 рядка  */
        .row-1:hover {
            background-color: #f5f504;
            color: #000000;
        }
        /* --- стиль 2-го рядка  --- */
        .row-2 {
            background-color: #f5f504;
            color: #000000; /* Контрастний чорний з color.adobe.com */
            transition: background-color 0.3s, color 0.3s;
        }
        /* Hover для 2-го рядка */
        .row-2:hover {
            background-color: #048f8f;
            color: #ffffff;
        }
        /* --- Третій рядок  --- */
        .row-3 {
            background-color: #ffffff;
            color: #333333;
            height: 45px;
        }
    </style>
</head>
<body>

    <h2>Лабораторна робота №2 — Варіант 4</h2>
    <table>
        <!-- 1-Й рядок -->
        <tr>
            <td class="row-1">Лісова</td>
            <td class="row-1">Аліна</td>
            <td class="row-1" rowspan="2" colspan="2">Миколаївна</td>
            <td class="row-1" ></td>
            <td class="row-1" rowspan="2">Варіант 4</td>
        </tr>
        <!-- 2-Й рядок -->
        <tr>
            <td class="row-2" colspan="2">Група ІС-42</td>
            <td class="row-2">ЛР-2</td>
        </tr>
        <!-- 3-Й рядок -->
        <tr class="row-3">
            <td colspan="2">&nbsp;</td>
            <td colspan="4">&nbsp;</td>
        </tr>
    </table>
</body>
</html>
