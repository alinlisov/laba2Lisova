<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2 - Варіант 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Лабораторна робота №2 — Варіант 4</h1>
<!-- ЗАВДАННЯ 1 -->
<section class="task-section">
        <h2>Завдання 1. Таблиця </h2>
    <table>
        <!-- 1-Й рядок -->
        <tr>
            <td class="row-1">Лісова</td>
            <td class="row-1">Аліна</td>
            <td class="row-1" rowspan="2" colspan="2">Миколаївна</td>
            <td class="row-1" ></td>
            <td class="row-1" rowspan="2">Варіант 4</td>
        </tr>
        <!-- 2-Й рядок -->
        <tr>
            <td class="row-2" colspan="2">Група ІС-42</td>
            <td class="row-2">ЛР-2</td>
        </tr>
        <!-- 3-Й рядок -->
        <tr class="row-3">
            <td colspan="2">&nbsp;</td>
            <td colspan="4">&nbsp;</td>
        </tr>
    </table>
</section>
    <hr class="divider">

<!-- ЗАВДАННЯ 2 -->
 <section class="task-section">
    <h2 class="title">Завдання 2. Приціл</h2>
    <div class="container">
        <!-- Спосіб 1: позиціонування -->
        <div class="block">
            <h3>1. Реалізація через position</h3>
            <div class="target-position">
                <div class="outer-ring"></div>
                <div class="inner-circle"></div>
                <div class="line-h"></div>
                <div class="line-v"></div>
            </div>
        </div>

        <!-- Спосіб 2: За допомогою трансформацій (transform) -->
        <div class="block">
            <h3>2. Реалізація через transform</h3>
            <div class="target-transform">
                <div class="ring-and-center"></div>
                <div class="cross-line h-line"></div>
                <div class="cross-line v-line"></div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
